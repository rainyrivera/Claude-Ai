<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#cfeedd;}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;}
#scene,#ovs{position:absolute;left:0;top:0;width:1080px;height:1920px;}
#ov{position:absolute;left:0;top:0;width:1080px;height:1920px;}
.band{position:absolute;left:0;right:0;top:240px;height:190px;background:linear-gradient(180deg,rgba(40,95,70,0) 0%,rgba(40,95,70,.30) 18%,rgba(40,95,70,.30) 82%,rgba(40,95,70,0) 100%);}
.cap{position:absolute;left:60px;right:60px;top:240px;height:190px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px 18px;font-weight:800;font-size:68px;line-height:84px;letter-spacing:-0.5px;}
.w{color:rgba(255,255,255,.42);text-shadow:0 3px 0 rgba(0,0,0,.10);padding:0 8px;border-radius:14px;}
.w.on{color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.22);}
.w.cur{color:#fff;background:#7c5cff;box-shadow:0 6px 0 #4b33c4;text-shadow:none;}
.pill{position:absolute;transform-origin:center;white-space:nowrap;font-weight:900;font-size:46px;letter-spacing:.5px;color:#fff;padding:12px 30px;border-radius:999px;box-shadow:0 7px 0 rgba(0,0,0,.25);}
.red{background:#ff3b4a;box-shadow:0 7px 0 #b51d2a;}
.blue{background:#3d6bff;box-shadow:0 7px 0 #2241b5;}
.green{background:#22c55e;box-shadow:0 7px 0 #138a3e;}
.violet{background:#7c5cff;box-shadow:0 7px 0 #4b33c4;}
.gray{background:#7d8a84;box-shadow:0 7px 0 #56615c;}
.dark{background:#17171c;box-shadow:0 7px 0 #000;}
.badge{position:absolute;font-weight:900;font-size:56px;color:#fff;padding:12px 38px;border-radius:999px;border:5px solid #fff;letter-spacing:1px;}
.card{position:absolute;width:190px;height:190px;border-radius:40px;background:#fff;box-shadow:0 10px 0 rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-size:110px;font-family:'Noto Color Emoji';}
.card .ck{position:absolute;right:-14px;top:-14px;width:64px;height:64px;border-radius:50%;background:#22c55e;color:#fff;font:900 44px Inter;display:flex;align-items:center;justify-content:center;border:5px solid #fff;}
.cal{position:absolute;width:260px;height:290px;border-radius:30px;background:#fff;box-shadow:0 12px 0 rgba(0,0,0,.18);overflow:hidden;text-align:center;}
.cal .h{background:#ff3b4a;color:#fff;font-weight:900;font-size:32px;padding:18px 0 14px;}
.cal .n{font-weight:900;font-size:140px;line-height:150px;color:#17171c;}
.cal .d{font-weight:800;font-size:30px;color:#555;margin-top:-10px;}
</style></head>
<body><div id="root">
<svg id="scene" viewBox="0 0 1080 1920"></svg>
<svg id="ovs" viewBox="0 0 1080 1920"></svg>
<div id="ov"></div>
</div>
<script>
const W = __WORDS__;
const S=i=>W[i].s, E=i=>W[i].e;
const DUR=58.6;
// ---------- math helpers ----------
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>{k=clamp(k,0,1);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;};
const ramp=(t,t0,d)=>ease((t-t0)/d);
const backOut=k=>{k=clamp(k,0,1);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);};
const V=(x,y)=>({x,y});
const add=(a,b)=>V(a.x+b.x,a.y+b.y), sub=(a,b)=>V(a.x-b.x,a.y-b.y), mul=(a,k)=>V(a.x*k,a.y*k);
const len=a=>Math.hypot(a.x,a.y), unit=a=>mul(a,1/len(a));
const ang=a=>Math.atan2(a.y,a.x)*180/Math.PI;
const fromAng=(deg)=>V(Math.cos(deg*Math.PI/180),Math.sin(deg*Math.PI/180));
const lerpV=(a,b,k)=>V(lerp(a.x,b.x,k),lerp(a.y,b.y,k));
const f1=n=>n.toFixed(1);
function smoothPath(pts,closed=true){ // catmull-rom -> bezier
  const n=pts.length;let d=`M${f1(pts[0].x)},${f1(pts[0].y)}`;
  for(let i=0;i<(closed?n:n-1);i++){
    const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    const c1=add(p1,mul(sub(p2,p0),1/6)),c2=sub(p2,mul(sub(p3,p1),1/6));
    d+=`C${f1(c1.x)},${f1(c1.y)} ${f1(c2.x)},${f1(c2.y)} ${f1(p2.x)},${f1(p2.y)}`;
  }
  return d+(closed?'Z':'');
}
// ---------- palette ----------
const SKIN='url(#skin)', SKIN2='url(#skin2)', RIM='#3b3b46', OUT='#7c5cff', OUT2='#5f43e0';
function limb(a,b,w1,w2,fill,stroke=RIM){
  const u=unit(sub(b,a)),n=V(-u.y,u.x);
  const p=[add(a,mul(n,w1/2)),add(b,mul(n,w2/2)),sub(b,mul(n,w2/2)),sub(a,mul(n,w1/2))];
  const pts=p.map(v=>f1(v.x)+','+f1(v.y)).join(' ');
  return `<g><circle cx="${f1(a.x)}" cy="${f1(a.y)}" r="${w1/2}" fill="${fill}" stroke="${stroke}" stroke-width="3"/><circle cx="${f1(b.x)}" cy="${f1(b.y)}" r="${w2/2}" fill="${fill}" stroke="${stroke}" stroke-width="3"/><polygon points="${pts}" fill="${fill}"/><line x1="${f1(p[0].x)}" y1="${f1(p[0].y)}" x2="${f1(p[1].x)}" y2="${f1(p[1].y)}" stroke="${stroke}" stroke-width="3"/><line x1="${f1(p[2].x)}" y1="${f1(p[2].y)}" x2="${f1(p[3].x)}" y2="${f1(p[3].y)}" stroke="${stroke}" stroke-width="3"/></g>`;
}
function ell(c,rx,ry,rot,fill,extra=''){return `<ellipse cx="${f1(c.x)}" cy="${f1(c.y)}" rx="${rx}" ry="${ry}" transform="rotate(${f1(rot)} ${f1(c.x)} ${f1(c.y)})" fill="${fill}" ${extra}/>`;}
function gloss(c,rx,ry,rot,op=.22){return ell(c,rx,ry,rot,'url(#gloss)',`opacity="${op}"`);}

// ---------- muscle highlight ----------
let hlId=0;
function muscle(c,rx,ry,rot,k,t,color='red'){
  if(k<=0.01) return '';
  const col=color==='red'?['#ff2a2a','#ff8a7a','#ff5050']:color==='green'?['#1fd16a','#9df5c0','#36e07f']:['#8a9690','#c7d0cc','#9aa6a0'];
  const pulse=color==='gray'?1:(0.85+0.15*Math.sin(t*9));
  const id='hc'+(hlId++);
  let s=`<g opacity="${f1(k)}"><defs><clipPath id="${id}"><ellipse cx="${f1(c.x)}" cy="${f1(c.y)}" rx="${rx}" ry="${ry}" transform="rotate(${f1(rot)} ${f1(c.x)} ${f1(c.y)})"/></clipPath></defs>`;
  s+=ell(c,rx*1.45,ry*1.6,rot,col[0],`opacity="${f1(.28*pulse)}" filter="url(#blur)"`);
  s+=ell(c,rx,ry,rot,col[0],`opacity="${f1(.9*pulse)}"`);
  // stripes along major axis
  const u=fromAng(rot),n=V(-u.y,u.x);let st='';
  for(let i=-6;i<=6;i++){const o=add(c,mul(n,i*ry/4.2));st+=`<line x1="${f1(o.x-u.x*rx*1.2)}" y1="${f1(o.y-u.y*rx*1.2)}" x2="${f1(o.x+u.x*rx*1.2)}" y2="${f1(o.y+u.y*rx*1.2)}" stroke="${col[1]}" stroke-width="4" opacity=".75"/>`;}
  s+=`<g clip-path="url(#${id})">${st}</g>`;
  s+=ell(add(c,mul(n,-ry*.35)),rx*.6,ry*.25,rot,'#fff','opacity=".25"');
  return s+'</g>';
}
function sparks(c,r,t,k,color='#ff3030'){
  if(k<=0.01)return '';let s='';
  for(let i=0;i<6;i++){
    const a=i*60+15*Math.sin(t*3+i);const ph=(t*2.2+i*.37)%1;
    const d=r*(1.0+ph*0.35);const p=add(c,mul(fromAng(a),d));const q=fromAng(a+90);const u=fromAng(a);
    const pts=[p,add(add(p,mul(u,14)),mul(q,10)),add(add(p,mul(u,26)),mul(q,-10)),add(p,mul(u,40))];
    s+=`<polyline points="${pts.map(v=>f1(v.x)+','+f1(v.y)).join(' ')}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="${f1(k*(1-ph*.7))}"/>`;
  }
  return s;
}
function arrow(a,b,color,k,w=16){
  if(k<=0.01)return '';const u=unit(sub(b,a)),n=V(-u.y,u.x);const e=lerpV(a,b,clamp(k*1.3,0,1));
  const h1=add(sub(e,mul(u,34)),mul(n,26)),h2=sub(sub(e,mul(u,34)),mul(n,26));
  return `<g opacity="${f1(clamp(k*3,0,1))}"><line x1="${f1(a.x)}" y1="${f1(a.y)}" x2="${f1(e.x-u.x*20)}" y2="${f1(e.y-u.y*20)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/><path d="M${f1(e.x)},${f1(e.y)}L${f1(h1.x)},${f1(h1.y)}L${f1(h2.x)},${f1(h2.y)}Z" fill="${color}" stroke="${color}" stroke-width="8" stroke-linejoin="round"/></g>`;
}
function xMark(c,k,s=48){if(k<=.01)return '';const sc=backOut(k);return `<g transform="translate(${f1(c.x)} ${f1(c.y)}) scale(${f1(sc)})"><circle r="${s}" fill="#ff3b4a" stroke="#fff" stroke-width="7"/><path d="M${-s*.4},${-s*.4}L${s*.4},${s*.4}M${s*.4},${-s*.4}L${-s*.4},${s*.4}" stroke="#fff" stroke-width="12" stroke-linecap="round"/></g>`;}
function check(c,k,s=48){if(k<=.01)return '';const sc=backOut(k);return `<g transform="translate(${f1(c.x)} ${f1(c.y)}) scale(${f1(sc)})"><circle r="${s}" fill="#22c55e" stroke="#fff" stroke-width="7"/><path d="M${-s*.45},0L${-s*.1},${s*.35}L${s*.48},${-s*.35}" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g>`;}

// ---------- eyes ----------
function eye(c,mode,rot,sz=1,t=0){
  const blink=(t%3.7)<0.12?0.15:1;
  let s=`<g transform="translate(${f1(c.x)} ${f1(c.y)}) rotate(${f1(rot)}) scale(${sz})">`;
  if(mode==='strain') s+=`<path d="M-14,-12L10,0L-14,12" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`;
  else if(mode==='happy') s+=`<path d="M-14,6Q0,-14 14,6" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>`;
  else if(mode==='surprised') s+=`<ellipse rx="17" ry="${22*blink}" fill="#fff"/><circle cx="2" cy="-2" r="${8*blink}" fill="#111"/>`;
  else if(mode==='bored') s+=`<ellipse rx="13" ry="10" cy="4" fill="#fff"/><circle cx="4" cy="6" r="6" fill="#111"/><line x1="-17" y1="-2" x2="17" y2="-2" stroke="#141418" stroke-width="9"/>`;
  else s+=`<ellipse rx="13" ry="${18*blink}" fill="#fff"/><circle cx="4" cy="-4" r="${7*blink}" fill="#111"/>`;
  return s+'</g>';
}

// ---------- SIDE (lying glute bridge) rig ----------
const FLOOR=1262;
function ik(P,A,L1,L2){
  let d=sub(A,P);let dl=Math.min(len(d),L1+L2-1);const u=unit(d);
  const a=(L1*L1-L2*L2+dl*dl)/(2*dl),h=Math.sqrt(Math.max(0,L1*L1-a*a));
  const mid=add(P,mul(u,a));let n=V(u.y,-u.x);if(n.y>0)n=mul(n,-1);
  return add(mid,mul(n,h));
}
function side(st,t){
  // st: lift, arch, shake, ext(single leg), eyes, hl{glute,ham,core,back}, hlColor
  st.arch=st.arch||0;st.lift=st.lift||0;
  const L1=255,L2=255;
  const S0=V(330,1196),H=V(222,1200),A=V(845,1200);
  const P0=V(565,1212),P1=V(615,1062);
  let P=lerpV(P0,P1,st.lift);P=add(P,V(st.arch*4,-st.arch*48));
  const sh=st.shake||0;P=add(P,V(0,sh*(Math.sin(t*71)*3+Math.sin(t*53)*2)));
  const S=S0;
  const u=unit(sub(P,S)),n=V(u.y,-u.x),L=len(sub(P,S));
  // knees
  const Kf=ik(add(P,V(-10,-4)),add(A,V(-22,-6)),L1,L2);
  let K=ik(P,A,L1,L2);let Afoot=A;
  const e=st.ext||0;
  if(e>0){
    const a1=ang(sub(K,P)),a2=ang(sub(A,K));const target=ang(u)-6;
    const na1=lerp(a1,target,e),na2=lerp(a2,target,e);
    K=add(P,mul(fromAng(na1),L1));Afoot=add(K,mul(fromAng(na2),L2));
  }
  let g='';
  // mat
  g+=`<rect x="70" y="${FLOOR-6}" width="960" height="34" rx="17" fill="#9fd3b6"/><rect x="70" y="${FLOOR-6}" width="960" height="10" rx="5" fill="#b9e3cb"/>`;
  // shadow
  g+=ell(V(560,FLOOR+40),430,26,0,'#000','opacity=".10" filter="url(#blur)"');
  // far leg (darker)
  const Pf=add(P,V(-10,-4)),Af=add(A,V(-22,-6));
  g+=limb(Pf,Kf,100,72,SKIN2,'#25252c')+limb(Kf,Af,70,46,SKIN2,'#25252c');
  g+=ell(add(Af,V(30,42)),60,23,0,SKIN2,'stroke="#25252c" stroke-width="3"');
  // hair (ponytail on floor)
  g+=`<path d="M175,1215 Q120,1205 70,1240 Q120,1262 185,1250 Z" fill="#141418" stroke="#2c2c34" stroke-width="3"/>`;
  // neck
  g+=limb(H,S,52,58,SKIN);
  // torso profile
  const prof=(s0,s1,steps=9)=>{
    const fr=[[0,52],[.15,74],[.28,80],[.42,60],[.6,50],[.8,56],[1,60],[1.1,40]];
    const bk=[[0,56],[.2,58],[.45,50],[.7,46],[.88,56],[1,64],[1.1,44]];
    const it=(arr,s)=>{for(let i=0;i<arr.length-1;i++){if(s<=arr[i+1][0]){const k=(s-arr[i][0])/(arr[i+1][0]-arr[i][0]);return lerp(arr[i][1],arr[i+1][1],k);}}return arr[arr.length-1][1];};
    const F=[],B=[];
    for(let i=0;i<=steps;i++){const s=lerp(s0,s1,i/steps);const bow=st.arch*30*Math.sin(Math.PI*clamp(s,0,1));
      const c=add(add(S,mul(u,s*L)),mul(n,bow));F.push(add(c,mul(n,it(fr,s))));B.push(sub(c,mul(n,it(bk,s))));}
    return smoothPath(F.concat(B.reverse()));
  };
  g+=`<path d="${prof(-0.08,1.1,12)}" fill="${SKIN}" stroke="${RIM}" stroke-width="3"/>`;
  g+=`<path d="${prof(0.1,0.38,6)}" fill="${OUT}" stroke="${OUT2}" stroke-width="3"/>`; // sports bra
  // glute + shorts
  const gc=add(add(P,mul(u,8)),mul(n,-26));
  g+=`<path d="${prof(0.8,1.1,6)}" fill="${OUT}" stroke="${OUT2}" stroke-width="3"/>`;
  g+=ell(gc,82,66,ang(u),OUT,`stroke="${OUT2}" stroke-width="3"`);
  g+=gloss(add(gc,mul(n,22)),46,16,ang(u),.25);
  g+=gloss(add(add(S,mul(u,L*.3)),mul(n,55)),70,14,ang(u),.22);
  // near thigh / shin / foot
  g+=limb(P,K,106,74,SKIN)+limb(P,lerpV(P,K,.32),110,100,OUT,OUT2);
  g+=limb(K,Afoot,72,46,SKIN);
  const vt=unit(sub(K,P));g+=gloss(add(lerpV(P,K,.6),mul(V(vt.y,-vt.x),24)),70,12,ang(vt),.2);
  if(e<0.5) g+=ell(add(Afoot,V(32,42)),62,24,0,SKIN,`stroke="${RIM}" stroke-width="3"`);
  else {const vs=unit(sub(Afoot,K));g+=ell(add(Afoot,mul(vs,26)),24,58,ang(vs)-90+90,SKIN,`stroke="${RIM}" stroke-width="3"`);}
  // head
  g+=`<circle cx="${H.x}" cy="${H.y}" r="66" fill="${SKIN}" stroke="${RIM}" stroke-width="3"/>`;
  g+=`<path d="M${H.x-64},${H.y+14} A66,66 0 0 1 ${H.x+22},${H.y-62} Q${H.x-20},${H.y-30} ${H.x-30},${H.y+40} Z" fill="#141418" opacity=".95"/>`; // hairline (back of head)
  g+=gloss(V(H.x+10,H.y-40),28,10,-20,.3);
  g+=eye(V(H.x+30,H.y-30),st.eyes||'normal',-60,1.1,t);
  // near arm on floor
  const Sh=add(S,V(18,16)),El=V(470,1232),Hd=V(612,1238);
  g+=limb(Sh,El,54,44,SKIN)+limb(El,Hd,44,36,SKIN)+`<circle cx="${Hd.x}" cy="${Hd.y}" r="25" fill="${SKIN}" stroke="${RIM}" stroke-width="3"/>`;
  // highlights
  const hl=st.hl||{},col=st.hlColor||{};
  g+=muscle(gc,86,64,ang(u),hl.glute||0,t,col.glute||'red');
  const hc=add(lerpV(P,K,.55),mul(V(-vt.y,vt.x),36));
  g+=muscle(hc,108,30,ang(vt),hl.ham||0,t,col.ham||'red');
  const cc=add(add(S,mul(u,L*.68)),mul(n,38));
  g+=muscle(cc,82,26,ang(u),hl.core||0,t,col.core||'red');
  const lb=add(add(S,mul(u,L*.8)),mul(n,-36));
  g+=muscle(lb,70,24,ang(u),hl.back||0,t,col.back||'red');
  if(st.spark) g+=sparks(st.spark.at==='ham'?hc:gc,90,t,st.spark.k);
  return {svg:g,pts:{P,S,K,A,gc,hc,cc,lb,u,n,L,head:H}};
}

// ---------- STANDING (front/back) ----------
const ARMS={
  down:{e:[V(372,950),V(708,950)],h:[V(366,1150),V(714,1150)]},
  hips:{e:[V(292,900),V(788,900)],h:[V(418,1045),V(662,1045)]},
  up:{e:[V(270,640),V(810,640)],h:[V(330,450),V(750,450)]},
  wave:{e:[V(292,900),V(820,640)],h:[V(418,1045),V(800,440)]},
};
function stand(st,t){
  const back=st.view==='back';
  const br=Math.sin(t*2.4)*4; // breathing
  const a0=ARMS[st.arms0||'hips'],a1=ARMS[st.arms1||st.arms0||'hips'],ak=st.armK||0;
  const Eh=[lerpV(a0.e[0],a1.e[0],ak),lerpV(a0.e[1],a1.e[1],ak)],Hh=[lerpV(a0.h[0],a1.h[0],ak),lerpV(a0.h[1],a1.h[1],ak)];
  if(st.wave){const wk=st.armK==null?1:st.armK;Hh[1]=add(Hh[1],V(Math.sin(t*9)*40*wk,0));}
  const shL=V(405,735+br*.3),shR=V(675,735+br*.3);
  let g='';
  g+=`<rect x="0" y="1745" width="1080" height="400" fill="#bfe5cf"/>`;
  g+=ell(V(540,1752),250,30,0,'#000','opacity=".13" filter="url(#blur)"');
  // ponytail behind (front view)
  if(!back) g+=`<path d="M606,520 Q712,580 672,790 Q650,830 628,800 Q660,670 590,590Z" fill="#141418" stroke="#2c2c34" stroke-width="3"/>`;
  // legs
  const hipL=V(478,1105),hipR=V(602,1105),kL=V(486,1405),kR=V(594,1405),anL=V(490,1690),anR=V(590,1690);
  g+=limb(hipL,kL,138,84,SKIN)+limb(hipR,kR,138,84,SKIN)+limb(kL,anL,84,50,SKIN)+limb(kR,anR,84,50,SKIN)+ell(V(478,1500),40,95,3,SKIN)+ell(V(602,1500),40,95,-3,SKIN);
  g+=ell(V(back?490:478,1718),52,26,0,SKIN,`stroke="${RIM}" stroke-width="3"`)+ell(V(back?590:602,1718),52,26,0,SKIN,`stroke="${RIM}" stroke-width="3"`);
  g+=gloss(V(462,1260),14,70,0,.2)+gloss(V(578,1260),14,70,0,.2);
  // torso
  const tor=[V(420,722),V(540,712),V(660,722),V(684,760),V(662,850),V(622,950),V(676,1060),V(690,1140),V(540,1170),V(390,1140),V(404,1060),V(458,950),V(418,850),V(396,760)];
  g+=`<path d="${smoothPath(tor)}" fill="${SKIN}" stroke="${RIM}" stroke-width="3"/>`;
  // neck
  g+=limb(V(540,650),V(540,735),70,84,SKIN);
  // bra
  if(back) g+=`<path d="M418,800 Q540,830 662,800 L654,868 Q540,890 426,868Z" fill="${OUT}" stroke="${OUT2}" stroke-width="3"/><path d="M455,742L470,805M625,742L610,805" stroke="${OUT}" stroke-width="16" stroke-linecap="round"/>`;
  else g+=`<path d="M418,790 Q470,760 540,800 Q610,760 662,790 L652,880 Q540,900 428,880Z" fill="${OUT}" stroke="${OUT2}" stroke-width="3"/><path d="M455,742L478,790M625,742L602,790" stroke="${OUT}" stroke-width="16" stroke-linecap="round"/>`;
  // shorts

        <svg width="880" height="330" style="position:absolute;left:0;top:0"><rect x="40" y="70" width="252" height="230" rx="16" fill="#ff3b4a" opacity=".08"/><rect x="330" y="70" width="430" height="230" rx="16" fill="#22c55e" opacity=".08"/>
        <text x="166" y="300" text-anchor="middle" font-family="Inter" font-weight="900" font-size="26" fill="#ff3b4a">FAST</text><text x="545" y="300" text-anchor="middle" font-family="Inter" font-weight="900" font-size="26" fill="#16a34a">SLOW</text>
        <polyline points="${pl}" fill="none" stroke="#ff3b4a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 30)"/><circle cx="${f1(last[0])}" cy="${f1(last[1]+30)}" r="14" fill="#ff3b4a" stroke="#fff" stroke-width="5"/></svg></div>`);
      if(t>=T.down){const kk=ramp(t,T.down,.5);ovs+=arrow(V(900,560),V(900,700+60*kk),'#22c55e',kk,20);}
      pill('RECOVER 🌿','green',540,1800,T.down,sh.t1);
      break;}
    case 'study':{
      view='stand';st={view:'front',arms0:'hips',eyes:'normal'};cam={z:lerp(1.0,1.08,ramp(t,sh.t0,4)),cx:540,cy:1040};
      card('📚',80,520,sh.t0+0.05,sh.t1,false);
      card('📅',810,520,T.four,sh.t1,false);
      pill('4+ DAYS A WEEK','blue',540,1560,T.four,T.months-0.1);
      pill('FOR 5 MONTHS','violet',540,1560,T.months,sh.t1);
      break;}
    case 'results':{
      view='stand';const up=t>=T.lower;
      st={view:'front',arms0:'hips',arms1:'up',armK:ramp(t,T.lower,.5),eyes:'happy'};cam={z:0.98,cx:540,cy:1060};
      card('🦵',90,520,T.stronger,sh.t1);card('🫁',800,520,T.better,sh.t1);card('❤️',445,1330,T.lower,sh.t1);
      pill('STRONGER LEGS','green',540,1600,T.stronger,T.better-0.1);
      pill('BETTER FITNESS','green',540,1600,T.better,T.lower-0.1);
      pill('LOWER BLOOD PRESSURE','green',540,1600,T.lower,sh.t1);
      break;}
    case 'compare':{
      st={eyes:'normal',speed:0};cam={z:0.62,cx:560,cy:760};
      const k=popk(t,sh.t0),o=vis(t,sh.t0);
      const h1=330*ease((t-sh.t0-0.2)/0.8),h2=95*ease((t-T.steady)/0.8);
      ov.push(`<div style="position:absolute;left:140px;top:470px;width:800px;height:520px;border-radius:36px;background:#fff;box-shadow:0 10px 0 rgba(0,0,0,.15);opacity:${o};transform:scale(${f1(k)})">
        <div style="position:absolute;left:0;right:0;top:22px;text-align:center;font:900 34px Inter;color:#17171c">IMPROVEMENT</div>
        <div style="position:absolute;left:130px;bottom:80px;width:200px;height:${f1(h1)}px;border-radius:22px 22px 8px 8px;background:#22c55e"></div>
        <div style="position:absolute;left:470px;bottom:80px;width:200px;height:${f1(Math.max(0,h2))}px;border-radius:22px 22px 8px 8px;background:#9aa6a0"></div>
        <div style="position:absolute;left:60px;width:340px;bottom:24px;text-align:center;font:900 30px Inter;color:#16a34a">INTERVALS</div>
        <div style="position:absolute;left:400px;width:340px;bottom:24px;text-align:center;font:900 30px Inter;color:#6b7772">STEADY PACE</div></div>`);
      pill('MUCH LESS','gray',705,1060,T.much,sh.t1);
      break;}
    case 'noeq':{
      st={eyes:'happy'};cam={z:1.0,cx:660,cy:1000};
      card('🏋️',90,600,S(126),sh.t1,'x');
      card('⏱️',800,600,T.just,sh.t1,true);
      pill('NO GYM','red',540,520,S(126),T.noeq-0.1);
      pill('NO EQUIPMENT','red',540,520,S(128),T.just-0.1);
      pill('JUST A TIMER ✓','green',540,520,T.just,sh.t1);
      break;}
    case 'follow':
    case 'send':{
      view='stand';st={view:'front',arms0:'hips',arms1:'wave',armK:ramp(t,T.follow,.4),wave:true,eyes:'happy'};cam={z:0.98,cx:540,cy:1060};
      if(sh.name==='follow'||t<T.send+0.3){
        const k=popk(t,T.follow),o=vis(t,T.follow,T.send-0.1);const tap=T.rous+0.1;const followed=t>=tap+0.15;
        const press=t>=tap&&t<tap+0.15?0.9:1;
        ov.push(`<div style="position:absolute;left:190px;top:1420px;width:700px;height:170px;border-radius:40px;background:#fff;box-shadow:0 10px 0 rgba(0,0,0,.15);opacity:${o};transform:scale(${f1(k)});display:flex;align-items:center;gap:26px;padding:0 30px;box-sizing:border-box">
          <div style="width:110px;height:110px;border-radius:50%;background:#cfeedd;border:5px solid #7c5cff;display:flex;align-items:center;justify-content:center;font:900 40px Inter;color:#17171c">RF</div>
          <div style="flex:1"><div style="font:900 40px Inter;color:#17171c">Rous Fit</div><div style="font:700 30px Inter;color:#6b7772">${HANDLE}</div></div>
          <div style="padding:20px 30px;border-radius:24px;background:${followed?'#22c55e':'#7c5cff'};color:#fff;font:900 34px Inter;transform:scale(${press})">${followed?'✓ FOLLOWING':'+ FOLLOW'}</div></div>`);
        if(t>=tap-0.5&&t<tap+0.8){const hk=clamp((t-(tap-0.5))/0.5,0,1);ov.push(`<div style="position:absolute;left:${f1(lerp(900,770,ease(hk)))}px;top:${f1(lerp(1640,1530,ease(hk)))}px;font-size:90px;font-family:'Noto Color Emoji';opacity:${f1(vis(t,tap-0.5,tap+0.6))}">👆</div>`);}
      }
      card('📲',800,520,T.send,DUR,false);
      pill('SEND TO A FRIEND','violet',540,1560,T.send+0.2,DUR);
      break;}
  }
  const pk=clamp((t-sh.t0)/0.22,0,1);const punch=sh.i>0?1+0.07*(1-ease(pk)):1;
  const z=cam.z*punch;
  const body=view==='walk'?walk(st,t).svg:stand(st,t).svg;
  const anchorY=1100;
  const tr=`translate(540 ${anchorY}) scale(${f1(z*100)/100}) translate(${f1(-cam.cx)} ${f1(-cam.cy)})`;
  document.getElementById('scene').innerHTML=DEFS+`<rect width="1080" height="1920" fill="url(#bg)"/>`+`<g transform="${tr}">${body}${world}</g>`;
  let tsvg='';
  if(timer){
    const C={yellow:['#ffd23f','#9a6b00'],red:['#ff3b4a','#8f0f1a'],green:['#2fd36b','#0f6b33']}[timer.color];
    const x=timer.x,y=timer.y;const k=timer.k;const fr=clamp(timer.v/timer.max,0,1);
    tsvg+=`<g transform="translate(${x} ${y}) scale(${f1(k)})"><text x="0" y="0" text-anchor="middle" font-family="Inter" font-weight="900" font-size="140" fill="${C[0]}" stroke="${C[1]}" stroke-width="14" paint-order="stroke fill" letter-spacing="-4">${fmt(timer.v)}</text>
      <rect x="-170" y="34" width="340" height="26" rx="13" fill="#000" opacity=".15"/><rect x="-170" y="34" width="${f1(340*fr)}" height="26" rx="13" fill="${C[0]}"/></g>`;
  }
  tsvg+=`<text x="1040" y="1870" text-anchor="end" font-family="Inter" font-weight="800" font-size="36" fill="#fff" stroke="#3a6b52" stroke-width="5" paint-order="stroke fill" opacity=".75">${HANDLE}</text>`;
  document.getElementById('ovs').innerHTML=DEFS+tsvg+ovs;
  let h='<div class="band"></div>';
  for(const p of pills) h+=`<div class="pill ${p.cls}" style="left:${p.x}px;top:${p.y}px;opacity:${f1(p.o)};transform:translate(-50%,-50%) scale(${f1(p.k)})">${p.txt}</div>`;
  for(const c of cards) h+=`<div class="card" style="left:${c.x}px;top:${c.y}px;opacity:${f1(c.o)};transform:scale(${f1(c.k)})">${c.emo}${c.ck==='x'?'<div class="ck" style="background:#ff3b4a">✗</div>':c.ck?'<div class="ck">✓</div>':''}</div>`;
  h+=ov.join('');
  h+=captions(t);
  document.getElementById('ov').innerHTML=h;
}

// ---------- captions ----------
const GROUPS=(()=>{const g=[];let cur=[];W.forEach((w,i)=>{cur.push(i);const end=/[.?:,…!]$/.test(w.w)||/\.\.\.$/.test(w.w);if(end||cur.length>=4){g.push(cur);cur=[];}});if(cur.length)g.push(cur);return g;})();
function captions(t){
  let gi=-1;for(let k=0;k<GROUPS.length;k++){if(t>=S(GROUPS[k][0])-0.05)gi=k;}
  if(gi<0)return '';const g=GROUPS[gi];const last=g[g.length-1];
  const next=gi+1<GROUPS.length?S(GROUPS[gi+1][0])-0.05:DUR;
  if(t>Math.min(next,E(last)+0.9))return '';
  const k=popk(t,S(g[0])-0.05);
  let s=`<div class="cap" style="transform:scale(${f1(0.9+0.1*clamp(k,0,1.1))})">`;
  for(const i of g){let cls='w';if(t>=S(i))cls+=' on';if(t>=S(i)&&t<E(i)+0.05)cls+=' cur';s+=`<span class="${cls}">${W[i].w.replace('...','…')}</span>`;}
  return s+'</div>';
}
window.frame=frame;window.DUR=DUR;
</script></body></html>
